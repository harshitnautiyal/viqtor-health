<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Access Denied</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
        }

        .card {
            width: 90%;
            max-width: 450px;
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            color: #b42318;
            margin-bottom: 10px;
        }

        p {
            color: #667085;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #1264d8;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">🔒</div>

    <h1>Access Denied</h1>

    <p>
        You do not have permission to access this section
        of the QR Health Monitoring System.
    </p>

    <a href="/admin">
        Return to Dashboard
    </a>

</div>

</body>
</html>
